<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">ServerQual hypothesis quality audit</title>
<desc id="desc">Of 20 hypotheses, 8 were rated poor, 6 weak, 6 moderate, and 0 strong.</desc>
<rect width="1100" height="420" fill="#ffffff"/>
<text x="55" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">Hypothesis quality audit</text>
<text x="55" y="92" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">Editorial assessment of the 20-hypothesis register - not a market measurement</text>
<text x="55" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">POOR</text>
<rect x="200" y="130" width="640" height="38" rx="6" fill="#991b1b"/>
<text x="860" y="157" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">8</text>
<text x="55" y="220" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">WEAK</text>
<rect x="200" y="195" width="480" height="38" rx="6" fill="#b45309"/>
<text x="700" y="222" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">6</text>
<text x="55" y="285" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">MODERATE</text>
<rect x="200" y="260" width="480" height="38" rx="6" fill="#047857"/>
<text x="700" y="287" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">6</text>
<text x="55" y="350" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">STRONG</text>
<rect x="200" y="325" width="2" height="38" rx="1" fill="#2563eb"/>
<text x="220" y="352" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">0</text>
</svg>